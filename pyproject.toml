[project]
name = "archivist"
version = "0.1.0"
description = "Grounded question answering over a historical manuscript"
readme = "README.MD"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb",
    "fastapi",
    "httpx",
    "openai",
    "pypdf",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
